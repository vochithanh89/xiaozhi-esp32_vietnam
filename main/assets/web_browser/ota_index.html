<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration</title>
    <style>
        /* Updated CSS to match wifi-config.html theme with indigo/purple colors */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: rgba(0, 0, 0, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background gradient */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 60px var(--shadow);
            padding: 32px 24px;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: var(--text-primary);
            text-align: center;
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .container > p {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 20px;
            background: var(--surface);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-box:hover { 
            background: var(--surface-light); 
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .upload-box.dragover { 
            background: var(--surface-light);
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .upload-icon { 
            font-size: 48px; 
            margin-bottom: 12px;
            filter: grayscale(0.3);
        }
        
        .upload-text { 
            color: var(--text-primary); 
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .upload-hint { 
            color: var(--text-muted); 
            font-size: 13px;
        }
        
        input[type="file"] { display: none; }

        .file-info {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid var(--border);
        }
        
        .file-info.show { display: block; }
        
        .file-name { 
            color: var(--text-primary); 
            font-weight: 600;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 6px;
        }
        
        .file-size { 
            color: var(--text-secondary); 
            font-size: 12px;
        }

        .progress-container { 
            display: none; 
            margin-bottom: 20px;
        }
        
        .progress-container.show { display: block; }
        
        .progress-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-weight: 500;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--surface);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .buttons { 
            display: flex; 
            gap: 12px; 
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-upload {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }
        
        .btn-upload:hover:not(:disabled) { 
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }
        
        .btn-upload:disabled { 
            background: var(--surface-light);
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }
        
        .btn-cancel { 
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-cancel:hover { 
            background: var(--surface-light);
            border-color: var(--danger);
            color: var(--danger);
        }

        .status {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid var(--border);
        }
        
        .status.show { display: block; }
        
        .status.success { 
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: var(--success);
        }
        
        .status.error { 
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }
        
        .status.info { 
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-light);
            border-color: var(--primary);
        }

        .info-box {
            background: var(--surface);
            border-left: 3px solid var(--primary);
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 20px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--primary);
        }

        .info-box strong {
            color: var(--text-primary);
            display: block;
            margin-bottom: 8px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--surface);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: var(--surface-light);
            color: var(--text-secondary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 24px 16px;
            }

            h1 {
                font-size: 24px;
            }

            .upload-box {
                padding: 32px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Configuration</h1>
        <p>Customize by CT03Dev</p>
        
        <!-- Mode Selection Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="appTab" onclick="switchMode('app')">
                📱 OTA Application
            </button>
            <button class="tab-btn" id="assetsTab" onclick="switchMode('assets')">
                🎨 Assets Update
            </button>
        </div>
        
        <div class="upload-box" id="uploadArea">
            <div class="upload-icon" id="uploadIcon">📦</div>
            <div class="upload-text">Click or drag file here</div>
            <div class="upload-hint">Supported: .bin files only</div>
            <input type="file" id="fileInput" accept=".bin" />
        </div>
        
        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-text">
                <span id="progressText">Uploading...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn-upload" id="uploadBtn" onclick="uploadFile()">Upload & Update</button>
            <button class="btn-cancel" id="cancelBtn" onclick="cancelUpload()" style="display:none;">Cancel</button>
        </div>
        
        <div class="info-box" id="infoBox">
            <strong>⚠️ Important:</strong>
            • File must be valid ESP32 firmware (.bin)<br>
            • Do not turn off device during update<br>
            • Update takes 1-3 minutes<br>
            • Device will reboot automatically
        </div>
    </div>

    <script>
        let selectedFile = null;
        let uploadInProgress = false;
        let currentMode = 'app'; // 'app' or 'assets'

        const uploadArea = document.getElementById('uploadArea');
        const uploadIcon = document.getElementById('uploadIcon');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const status = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const infoBox = document.getElementById('infoBox');
        const appTab = document.getElementById('appTab');
        const assetsTab = document.getElementById('assetsTab');

        function switchMode(mode) {
            currentMode = mode;
            
            // Update tabs
            if (mode === 'app') {
                appTab.classList.add('active');
                assetsTab.classList.remove('active');
                uploadIcon.textContent = '📦';
                infoBox.innerHTML = `
                    <strong>⚠️ Important:</strong>
                    • File must be valid ESP32 firmware (.bin)<br>
                    • Do not turn off device during update<br>
                    • Update takes 1-3 minutes<br>
                    • Device will reboot automatically
                `;
            } else {
                assetsTab.classList.add('active');
                appTab.classList.remove('active');
                uploadIcon.textContent = '🎨';
                infoBox.innerHTML = `
                    <strong>⚠️ Important:</strong>
                    • File must be valid assets binary (.bin)<br>
                    • Do not turn off device during update<br>
                    • Update takes 1-3 minutes<br>
                    • Device will apply assets after upload
                `;
            }
            
            // Reset upload state
            selectedFile = null;
            fileInfo.classList.remove('show');
            status.classList.remove('show');
            progressContainer.classList.remove('show');
            uploadBtn.disabled = false;
            uploadBtn.style.display = 'block';
            cancelBtn.style.display = 'none';
        }

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                selectFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectFile(e.target.files[0]);
            }
        });

        function selectFile(file) {
            if (!file.name.endsWith('.bin')) {
                showStatus('Only .bin files supported', 'error');
                return;
            }
            
            selectedFile = file;
            fileName.textContent = '📄 ' + file.name;
            fileSize.textContent = 'Size: ' + formatFileSize(file.size);
            fileInfo.classList.add('show');
            uploadBtn.disabled = false;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function uploadFile() {
            if (!selectedFile) {
                showStatus('Please select a file', 'error');
                return;
            }

            uploadInProgress = true;
            uploadBtn.disabled = true;
            uploadBtn.style.display = 'none';
            cancelBtn.style.display = 'block';
            progressContainer.classList.add('show');
            status.classList.remove('show');

            const formData = new FormData();
            formData.append('file', selectedFile);

            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressFill.style.width = percentComplete + '%';
                    progressPercent.textContent = Math.round(percentComplete) + '%';
                    progressText.textContent = 'Uploading: ' + formatFileSize(e.loaded) + ' / ' + formatFileSize(e.total);
                }
            });

            xhr.addEventListener('load', () => {
                if (xhr.status === 200) {
                    try {
                        const resp = JSON.parse(xhr.responseText);
                        if (resp.success) {
                            progressFill.style.width = '100%';
                            progressPercent.textContent = '100%';
                            
                            if (currentMode === 'app') {
                                progressText.textContent = 'Processing firmware...';
                                setTimeout(() => {
                                    showStatus('Upload successful! Device updating and rebooting...', 'success');
                                    setTimeout(() => {
                                        location.reload();
                                    }, 10000);
                                }, 2000);
                            } else {
                                progressText.textContent = 'Processing assets...';
                                setTimeout(() => {
                                    showStatus('Upload successful! Assets updated.', 'success');
                                    setTimeout(() => {
                                        location.reload();
                                    }, 10000);
                                }, 1000);
                            }
                        } else {
                            showStatus('Update failed: ' + (resp.error || 'Unknown error'), 'error');
                            resetUpload();
                        }
                    } catch (e) {
                        showStatus('Invalid response', 'error');
                        resetUpload();
                    }
                } else {
                    showStatus('Upload failed: ' + xhr.status, 'error');
                    resetUpload();
                }
            });

            xhr.addEventListener('error', () => {
                showStatus('Connection error', 'error');
                resetUpload();
            });

            // Choose endpoint based on current mode
            const endpoint = currentMode === 'app' ? '/ota_upload' : '/assets_upload';
            xhr.open('POST', endpoint);
            xhr.send(formData);
            showStatus('Uploading...', 'info');
        }

        function cancelUpload() {
            resetUpload();
            showStatus('Upload cancelled', 'info');
        }

        function resetUpload() {
            uploadInProgress = false;
            uploadBtn.disabled = false;
            uploadBtn.style.display = 'block';
            cancelBtn.style.display = 'none';
            progressContainer.classList.remove('show');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status show ' + type;
        }
    </script>
</body>
</html>
